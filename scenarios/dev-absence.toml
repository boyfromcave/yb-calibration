# A defect forces miners to halt ENFORCEMENT at day 30 (enforcing share falls below
# enforcementFloor) and the developers are absent for `days`; when they return they run the
# freeze-then-fix runbook (W19). Measures how long vaults stay unsweepable versus the abandonment
# window (abandonBlocks), and whether abandonment fires while developers are merely slow.
name = "dev-absence"
description = "ENFORCEMENT halted at day 30 by a defect; developers absent for `days`, then the runbook"
stresses = "abandonment window (abandonBlocks) vs freeze-then-fix runbook length"
tags = ["governance"]
horizon_days = 150
resolution = "hour"
p0_usd = 0.40

[base]
model = "gbm"
params = { mu = 0.0, sigma = 1.0 }

[schedules.enforcing_share]
default = 0.80
changes = [{ at_days = 30, value = 0.40 }, { at_days = 90, value = 0.80 }]

[schedules.dev_present]
default = 1
changes = [{ at_days = 30, value = 0 }, { at_days = 90, value = 1 }]

[constants]
incident_day = 30
dev_absence_days = 60

[[variants]]
name = "dev-absence-14"
description = "developers absent for 14 days after a defect halts ENFORCEMENT at day 30"
horizon_days = 104
set = { "schedules.dev_present.changes.1.at_days" = 44, "schedules.enforcing_share.changes.1.at_days" = 44, "constants.dev_absence_days" = 14 }

[[variants]]
name = "dev-absence-30"
description = "developers absent for 30 days after a defect halts ENFORCEMENT at day 30"
horizon_days = 120
set = { "schedules.dev_present.changes.1.at_days" = 60, "schedules.enforcing_share.changes.1.at_days" = 60, "constants.dev_absence_days" = 30 }

[[variants]]
name = "dev-absence-60"
description = "developers absent for 60 days after a defect halts ENFORCEMENT at day 30"
horizon_days = 150
set = { "schedules.dev_present.changes.1.at_days" = 90, "schedules.enforcing_share.changes.1.at_days" = 90, "constants.dev_absence_days" = 60 }

[[variants]]
name = "dev-absence-90"
description = "developers absent for 90 days after a defect halts ENFORCEMENT at day 30"
horizon_days = 180
set = { "schedules.dev_present.changes.1.at_days" = 120, "schedules.enforcing_share.changes.1.at_days" = 120, "constants.dev_absence_days" = 90 }

[[variants]]
name = "dev-absence-180"
description = "developers absent for 180 days after a defect halts ENFORCEMENT at day 30 (truly gone)"
horizon_days = 270
set = { "schedules.dev_present.changes.1.at_days" = 210, "schedules.enforcing_share.changes.1.at_days" = 210, "constants.dev_absence_days" = 180 }
