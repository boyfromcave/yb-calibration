# yb-calibration CI (workspace CI/CD design, 2026-10-06).
#
# Push / PR: `lint` (ruff, the registry docs, the parameter snapshot's invariants, the kernel parity
# check `ybcal verify`: seconds) and `test` (pytest without the devnet marker, spread over the
# runner's cores with pytest-xdist). That is all CI ever runs: by the owner's rule (2026-10-05)
# calibration runs only on stable node builds, so no `ybcal recommend`, `robust`, `sensitivity` or
# devnet differential runs here, on any trigger, and nothing fetches market data. `ybcal verify` is
# the one model run CI does: a parity check of the kernels against the reference model, not a sweep.
# The devnet-marked tests need a built ycashd (YBCAL_YCASH6); they stay a developer's run.
# `node` is a check, not a calibration run: it fetches ycash6 (no build) so the vendored model and the
# clone-backed tests are compared with the node's own tree instead of skipping.
name: ci

# The branch list lives once, here: pull_request is unfiltered (every PR runs), push runs on the
# hardening and upgrade lines, the post-quantum line (upgrade/quantum-vaults, cut from main), main
# (the branch of record) and the ci/* branches that carry CI changes before they merge.
on:
  push:
    branches: [ harden/yellowback, upgrade/vault, upgrade/quantum-vaults, main, 'ci/**' ]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push or PR update supersedes the older run; a dispatched run is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Actions pinned by commit; the comment names the tag the SHA was taken from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Registry docs are current
        run: ybcal params doc --check
      - name: Params check (snapshot)
        run: ybcal params check
      - name: Kernel parity (ybcal verify; a check, not a calibration run)
        run: ybcal verify

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (plus pytest-xdist, CI only)
        run: pip install -e ".[dev]" "pytest-xdist==3.8.0"
      - name: Pytest (no devnet), one worker per core
        run: pytest -q -m "not devnet" -n auto --durations=10

  node:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch ycash6 (full history, read-only, not built)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: boyfromcave/ycash6
          ref: upgrade/vault
          path: ycash6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (plus pytest-xdist, CI only)
        run: pip install -e ".[dev]" "pytest-xdist==3.8.0"
      # `shell: bash` runs with -o pipefail: without it the exit status of `ybcal verify` / `pytest` is
      # tee's, so a crash or a failing test would pass the step
      - name: Vendored model equals ycash6 at the recorded commits (ybcal verify --ycash6)
        shell: bash
        env:
          YBCAL_YCASH6: ${{ github.workspace }}/ycash6
        run: ybcal verify --quiet | tee verify.log && ! grep -q '^FAIL' verify.log
      - name: Pytest against the ycash6 tree (no devnet); a clone-gated skip fails the job
        shell: bash
        env:
          YBCAL_YCASH6: ${{ github.workspace }}/ycash6
        run: |
          pytest -q -m "not devnet" -n auto -rs | tee pytest.log
          ! grep -E '^SKIPPED.*(ycash6 clone|lacks )' pytest.log
