# yb-calibration CI (workspace CI/CD design, 2026-10-06).
#
# Push / PR: `lint` (ruff, the registry docs, the parameter snapshot's invariants, the kernel parity
# check `ybcal verify`: seconds) and `test` (pytest without the devnet marker, spread over the
# runner's cores with pytest-xdist). That is all CI ever runs: by the owner's rule (2026-10-05)
# calibration runs only on stable node builds, so no `ybcal recommend`, `robust`, `sensitivity` or
# devnet differential runs here, on any trigger, and nothing fetches market data. `ybcal verify` is
# the one model run CI does: a parity check of the kernels against the reference model, not a sweep.
# The devnet-marked tests need a built ycashd (YBCAL_YCASH6); they stay a developer's run.
name: ci

# The branch list lives once, here: pull_request is unfiltered (every PR runs), push runs on the
# hardening and upgrade lines, main (the branch of record) and the ci/* branches that carry CI
# changes before they merge.
on:
  push:
    branches: [ harden/yellowback, upgrade/vault, main, 'ci/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push or PR update supersedes the older run; a dispatched run is never cancelled.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions pinned by commit; the comment names the tag the SHA was taken from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Registry docs are current
        run: ybcal params doc --check
      - name: Params check (snapshot)
        run: ybcal params check
      - name: Kernel parity (ybcal verify; a check, not a calibration run)
        run: ybcal verify

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (plus pytest-xdist, CI only)
        run: pip install -e ".[dev]" "pytest-xdist==3.8.0"
      - name: Pytest (no devnet), one worker per core
        run: pytest -q -m "not devnet" -n auto --durations=10
