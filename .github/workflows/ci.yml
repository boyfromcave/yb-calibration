name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest (no devnet)
        run: pytest -q -m "not devnet"
      - name: Registry docs are current
        run: ybcal params doc --check
      - name: Params check (snapshot)
        run: ybcal params check
