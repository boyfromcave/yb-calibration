[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ybcal"
version = "0.1.0"
description = "Calibration tool for the Ycash Yellowback (YED) parameter set"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4"]

[project.scripts]
ybcal = "ybcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ybcal = ["params/*.json", "model/*.json", "model/*.md", "report/templates/*", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "devnet: needs a built ycashd (YBCAL_YCASHD or a built worktree); skipped otherwise",
    "slow: long-running test (budget standard/deep)",
]
