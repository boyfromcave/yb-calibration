# ybcal risk policy — the owner's risk appetite (PLAN §2.4, §5, §12).
#
# Copy this file, edit it, and pass it with `--policy FILE`. Every value is a STARTING TOLERANCE for
# the owner to confirm, not a decision. Section headers only group keys: every key below is a field
# of `ybcal.config.Policy`, and keys are unique across sections. A table whose name is itself a
# Policy field (e.g. [risk.max_bad_debt_prob]) is that field's value.
#
# Units are in the comment on each line. Probabilities are fractions (0.01 = 1 %). Shares are
# fractions of hashrate or attestor weight. Money in policy is in USD (floats are fine here: the
# policy is a tolerance, never a consensus quantity).

[general]
materiality = 0.20                 # min relative improvement of a param's primary metric to move off its current value (§2.3, §12.2)
seed = 20261003                    # default RNG seed for every run (overridden by --seed)
require_real_data_for_lock = true  # lock-readiness needs real-data provenance for every locked param (§7)

[risk]
class_heterogeneity_max = 0.50     # max relative spread of P(bad debt) within one class before a split/merge is suggested (§5.3)
term_distribution = "uniform"      # lock-term distribution within each class: "uniform" | "short-heavy" | "long-heavy" (§5.3)
sigma_mult_at = "median"           # σ multiplier assumed when sizing base ratios: "median" | "p90" (§5.3)
price_drift = "centred"            # drift of long-horizon solvency price paths: "centred" (median flat) | "martingale" (E[p] flat, −σ²/2 bleed) | "model" (D-RD-AUD-1)

[risk.max_bad_debt_prob]           # max P(collateral < debt when the claim path opens), per term class (§5.3, §12.1)
A = 0.005
B = 0.01
C = 0.02

[claims]
claimant_min_profit_bps = 200      # bps of vault value a claimant must net after fees to show up (§5.3)
claimant_slippage_pctl = 90        # percentile of liquidation slippage used for claimant profit (§5.3)

[oracle]
attack_share_min = 0.34            # smallest colluding hash share that may be able to move a median (§5.1, §12.1)
max_no_price_hours = 6.0           # max expected hours/year with NO_PRICE set (§5.1)
attack_moved_tol = 0.05            # max fraction of attack blocks in which a coalition at attack_share_min moves the harmful price (G1, D-WP7a-2)
pool_outage_rate_per_day = 0.033333333333333  # per-pool feed outages per day assumed in G1/G2 availability (D-WP7a-3)
pool_outage_mean_hours = 4.0       # mean duration of a per-pool feed outage, hours (D-WP7a-3)
pump_overpricing_lambda = 0.5      # weight of pump overpricing vs crash-lag CVaR in the G1 objective (§5.1)
crash_lag_cvar_alpha = 0.95        # CVaR level for crash tracking lag (§5.1)
max_sigma_lag_blocks = 4032        # max blocks for σ multiplier to reach 90 % of a new regime (§5.2)
sigma_ref_round_bps = 500          # sigmaRefBps rounding step (§5.2)
sigma_mult_cap_pctl = 99           # percentile of the turbulent multiplier the cap must cover (§5.2)
sigma_accept_band = [1.0, 1.5]     # M14 acceptance band for the median multiplier at realised volatility (§5.2)
hour_kernel_tolerance_bps = 300.0  # max p95 relative error (bps) of the hour-mode oracle kernel vs block mode (§3.3)

[activation]
max_false_halt_hours_per_year = 24.0  # max expected hours/year of false PARTICIPATION/ENFORCEMENT halts (§5.5, §12.1)
expected_enforcing_share = 0.80    # hash share expected to run enforcing nodes (§5.5, §12.1)
detection_drop_share = 0.45        # a real drop to this share must be detected… (§5.5)
max_detection_blocks = 4032        # …within this many blocks (§5.5)
max_flaps_per_year = 2.0           # max halt/clear cycles per year at the expected share (§5.5)
operator_upgrade_window_blocks = 2016  # activationDelay must be >= this (time for operators to upgrade, §5.5)
orphan_rate = 0.005                # orphan rate used for valve false-trip estimates (§5.5)
max_valve_false_trips_per_year = 1.0   # excluded param valveBlocks: tolerated false trips/year (§5.5)

[abandonment]
max_false_abandon_prob = 0.001     # max P(ENFORCEMENT set for abandonBlocks without a real abandonment) per year (§5.4)
runbook_operator_buffer_blocks = 4608  # operator buffer in the freeze-then-fix runbook (§5.4), 4 days
release_lead_blocks = 16128        # M14 release lead (two weeks of blocks); a protocol fact, mirrored here for the runbook
renewal_lead_blocks = 210240       # W18 renewal deadline: this many blocks before the sunset (~6 months, §5.11)

[owner_absence]                    # honest-owner absence model for grace (§5.4): log-normal absence spells
owner_absence_median_days = 7.0    # median absence spell, days
owner_absence_sigma = 1.0          # log-normal shape (σ of ln days)
owner_absence_rate_per_year = 1.0  # expected absence spells per owner per year
max_owner_miss_prob = 0.01         # max P(an honest owner misses the window between lock and claim) (§5.4)
w_owner = 1.0                      # weight of P(miss) in the grace objective (§5.4)
w_debt = 1.0                       # weight of ΔP(bad debt) in the grace objective (§5.4)

[judgement]
k_dev = 1.5                        # deviationBps >= k_dev × p99 honest deviation (§5.6)
max_not_evaluated_prob = 0.05      # max P(fewer than peerMin peers) at the expected pool count (§5.6)
expected_pool_count = 6            # tagging pools expected on mainnet (§5.6)
max_false_penalty_rate = 0.01      # max fraction of honest pool-blocks judged bad (§5.6)
pool_feed = "agent"                # honest pool quote model: "agent" = the shipped agent's median of the venues; "venue" = one venue per pool (D-RD-ATT-1)
agent_min_sources = 3              # agent min_sources (both sample configs ship 3; fail closed below)
agent_outlier_bps = 1000           # agent outlier filter, bps from the median (yellowback_price.py OUTLIER_BPS)
attest_price_model = "bootstrap"  # G6/G8 model of the real price: "bootstrap" (demeaned hourly) | "regime" (fitted on daily) | "gbm" (driftless, the martingale stress) (D-RD-ATT-10)

[fees]
max_fee_share_small = 0.02         # max total fee as a share of a minMint vault's value (§5.6, §5.9)
pool_min_monthly_revenue_usd = 50.0       # min fee revenue/month per enforcing pool under adoption_low (§5.6)
attestor_min_monthly_revenue_usd = 50.0   # min fee revenue/month per seated attestor under adoption_low (§5.6)
pool_operating_cost_usd_month = 20.0      # pool's marginal cost of running enforcement (§5.6)
bond_opportunity_cost_apr = 0.05          # annual opportunity cost of a locked bond (§5.6, G8 coupling)

[adoption]
adoption_case = "low"              # adoption scenario fee decisions must clear: "low" | "mid" | "high" (§5.6)

[adoption.adoption_scenarios]      # YED outstanding (USD) and mints/redeems per day per scenario (§5.6)
low = { yed_supply_usd = 50000.0, mints_per_day = 2.0, redeems_per_day = 1.0 }
mid = { yed_supply_usd = 500000.0, mints_per_day = 10.0, redeems_per_day = 6.0 }
high = { yed_supply_usd = 5000000.0, mints_per_day = 50.0, redeems_per_day = 30.0 }

[supply]
max_depth_fraction = 0.10          # max liquidation volume as a share of p10 daily YEC volume (§5.7, §5.9)
max_class_closed_days = 90.0       # max days classes B/C stay closed by the early supply cap before a design note (§5.7)
halt_recall_floor = 0.90           # min recall of HALT-3 on crash scenarios when picking divergenceBps (§5.7)

[attestation]
attestor_uptime = 0.95             # per-attestor uptime assumed for liveness (§5.8, §12.1)
attestor_outage_correlation = 0.10 # pairwise correlation of attestor outages (§5.8)
max_attest_unavailability = 0.01   # max P(minting refuses for want of a bundle) (§5.8)
max_single_entity_weight_share = 0.25   # largest attestor weight share one entity is assumed to hold; qLowBps must exceed it (§1.4, §5.8)
diverge_spread_multiplier = 3.0    # divergeBpsAttest = this × worst-pair p95 spread (§5.8, proposal §16)
max_mint10_refusal_prob = 0.01    # max share of honest calm mints MINT-10 refuses (pFast vs aMint, aggregated feeds; D-RD-ATT-3)
min_bond_cap_years = 2.0          # bondMin: harmful-capture capital >= this many years of MINT-6 cap growth, in YEC (D-RD-ATT-4)
min_harm_capture_seats_share = 0.75  # qLowBps: a seat-splitting adversary needs >= this share of the seats to move aMint up (D-RD-ATT-11)
pin_low_move_fraction = 0.05       # if fewer windows than this have a pinDelta move, lower pinDeltaBps (§5.8)
max_false_pin_prob = 0.01          # max P(an honest pool/attestor is marked pinned) per day (§5.8)
max_false_ejection_prob = 0.01     # max P(honest attestor ejected for dormancy) per year (§5.8)
max_dead_detection_blocks = 32256  # max blocks to eject a dead attestor (§5.8), 28 days
attest_relay_budget_per_block = 2.0  # attestations relayed per attestor per block the network tolerates (§5.8, k choice)

[amounts]
worst_price_usd = 100.0            # highest YEC price the policy covers; 4·feeMin must fit a minMint vault there (§1.4, §5.9)
dust_zat = 546                     # dust threshold used for residual / output checks, zat (§5.9)
reorg_attacker_share = 0.30        # hash share of a reorging adversary for walletConfirmations / REF_LAG (§5.9)
max_reorg_prob = 0.001             # max P(a reorg deeper than the wallet's wait) (§5.9)
max_void_prob = 0.01               # max P(a mint is VOIDed by a reorg past REF_LAG) (§5.9)

[optimizer]
max_rounds_joint = 3               # coordinate-descent rounds in the joint pass (§5.10)
insensitive_total_order = 0.01     # Sobol total-order index below which a param is "insensitive" (§5.10)

[studies_g5_g8]  # assumptions of the G5/G8 studies (D-WP7c)
activation_reliability = 0.99                 # probability activation completes within the expected time (G5)
valve_minority_trip_max = 0.01                 # max probability the work valve trips under a minority enforcing share (G5)
attestor_mean_outage_blocks = 48                   # mean attestor outage length, blocks (G8)
max_harmful_capture_prob = 0.01                 # max probability a captured entity can move a bundle price in the harmful direction (G8)
max_grief_capture_prob = 0.05                 # max probability of griefing-only capture of a bundle (G8)
max_premature_claim_prob = 0.01                 # max probability a wick turns into an emergency claim (G8)
claim_reaction_blocks = 576                  # blocks a claimant needs to react to a notice (G8)
registration_notice_blocks = 8064                 # public notice before arming, blocks (G8)
min_capture_days = 90                   # min days for a new large bond to reach capture weight (G8)
max_newcomer_seat_days = 365                  # max days for a new honest bond to win a seat (G8)

[agents]  # behavioural assumptions of the vault-book personas (D-WP4-3); studies map these onto AgentsConfig
yed_premium_bps = 0                # premium (+) or discount (-) of YED vs $1 when burners buy it, bps
claimant_slippage_bps = 100        # base slippage a claimant pays selling seized YEC, bps
defector_share = 0.0               # fraction of owners who sweep without burning when enforcement is off
lost_key_prob = 0.0                # probability an owner's key is lost for good

[studies_g3_g4_g9]  # assumptions of the G3/G4/G9/release studies (D-WP7b); "" or omitted = unknown
ensemble_agg = "worst"             # how G3 aggregates bad-debt probability across synthetic presets: worst | mean
dev_absence_tolerance_days = 0     # developer absence the abandonment window must tolerate beyond the runbook, days
dust_spend_multiple = 3            # residual/output must be >= this many times the cost of spending it
residual_max_share = 0.01          # max share of a vault's collateral left unpaid below residualMinZat
carrier_max_share = 0.001          # max carrier value as a share of a minMint vault
mint_inclusion_slack_blocks = 10   # blocks a mint may wait for inclusion when choosing DEFAULT_REF_LAG
release_tip = 3052055              # mainnet tip at the release (M14 lead is counted from here)
release_tip_date = "2026-10-02"    # date of release_tip
# Optional, unset by default (TOML has no null; add the key to set it):
# yec_daily_volume_p10_usd = 150000.0   # p10 daily YEC trading volume, USD — enables the maxMint/supply-cap depth checks
# reference_price_usd = 0.40            # YEC/USD reference price for fee/bond judgements (default: from data)
# next_upgrade_height = 3500000         # next scheduled Ycash network upgrade (default: read from chainparams; none scheduled)

[studies_g6_g7]  # assumptions of the G6/G7 studies (D-WP7d-6)
liar_bias_bps = 2000                 # quote bias of the liar the judgement rules must catch, bps (G6)
min_liar_detection = 0.9                  # min probability REG-4 penalises that liar (G6)
max_fee0_prob = 0.001                # max probability a block has no eligible payee (FEE-0) (G6)
min_registered_prob = 0.999                # min probability an honest pool is registered (REG-1) (G6)
min_liar_exclusion = 0.99                 # min probability the wallet payee rule excludes a liar (G6)
max_honest_exclusion = 0.01                 # max probability the wallet payee rule excludes an honest pool (G6)
max_accuracy_sd_bps = 500                  # max sd of honest pools' accuracy score, bps (G6)
max_honest_payee_spread = 1.5                  # max ratio between honest pools' payee weights (G6)
min_accuracy_premium = 0.25                 # min payee-weight premium of an accurate over a sloppy pool (G6)
p10_daily_volume_usd = 25000.0              # PLACEHOLDER p10 daily YEC volume, USD, used by G7 only when no depth file and no yec_daily_volume_p10_usd (G7)
system_ratio_alarm_bps = 15000                # HALT-2 must fire before the true system ratio reaches this, bps (G7)
